<a [routerLink]="['/programs/add-on-courses', course().slug]"
   class="group relative flex h-full items-start gap-4 rounded-2xl border border-neutral-200 bg-white p-4 sm:p-5 transition-all duration-300 hover:-translate-y-0.5 hover:border-brand-primary hover:shadow-[0_12px_30px_rgba(204,0,0,0.10)]">
  <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-red-50 text-sm font-black text-brand-primary transition-colors duration-300 group-hover:bg-brand-primary group-hover:text-white">
    {{ indexLabel() }}
  </span>

  <span class="min-w-0 flex-1">
    <span class="block text-[0.95rem] font-black leading-snug tracking-tight text-neutral-900 transition-colors group-hover:text-brand-primary">{{ course().badgeLabel }}</span>
    <span class="mt-1 block text-xs leading-relaxed text-neutral-500">{{ course().heroSubTag }}</span>
  </span>

  <svg class="mt-1 h-4 w-4 shrink-0 text-neutral-300 transition-all duration-300 group-hover:translate-x-0.5 group-hover:text-brand-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
  </svg>
</a>
