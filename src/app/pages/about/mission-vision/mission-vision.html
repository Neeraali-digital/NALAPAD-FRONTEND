<main class="min-h-screen bg-white font-sans">

  <!-- ═══════════════════════════════════════ -->
  <!-- HERO SECTION                            -->
  <!-- ═══════════════════════════════════════ -->
  <section class="relative h-[55vh] min-h-[380px] flex items-center justify-center bg-neutral-950 overflow-hidden">
    <!-- Background image -->
    <div class="absolute inset-0">
      <picture>
        <source media="(min-width: 768px)" srcset="/banners/vissionMissionLargerScreen.jpeg">
        <img
          src="/banners/visionMissionMoblile.jpeg"
          class="w-full h-full object-cover object-center"
          alt="Mission Vision Hero"
        >
      </picture>

    </div>

    <!-- Hero Content -->
    <div class="relative z-10 text-center px-6">
      <h1 class="text-4xl md:text-5xl lg:text-6xl font-black text-white tracking-tight mb-4 drop-shadow-lg">
        Our Mission, Vision &amp; Goals
      </h1>
      <p class="text-white/80 text-base md:text-lg font-light tracking-wide">
        Guided by purpose. Driven by impact.
      </p>
    </div>

    <!-- Curve Divider -->
    <div class="absolute -bottom-[1px] left-0 w-full overflow-hidden leading-[0]">
      <svg class="block w-full h-[40px] md:h-[70px] translate-y-[1px]" viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path d="M0,120 L0,60 Q600,-60 1200,60 L1200,120 Z" fill="#fdf5f5" />
      </svg>
    </div>
  </section>


  <!-- ═══════════════════════════════════════ -->
  <!-- THREE CARDS SECTION                     -->
  <!-- ═══════════════════════════════════════ -->
  <section class="bg-[#fdf5f5] py-16 md:py-24">
    <div class="max-w-7xl mx-auto px-6 sm:px-10 lg:px-16">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

        <!-- MISSION CARD -->
        <div class="bg-white rounded-2xl p-8 shadow-sm border border-neutral-100 flex flex-col relative overflow-hidden group hover:shadow-xl transition-shadow duration-500">
          <!-- Icon -->
          <div class="flex items-center gap-4 mb-5">
            <div class="w-14 h-14 rounded-xl bg-red-50 flex items-center justify-center shrink-0 group-hover:bg-brand-primary/10 transition-colors duration-300">
              <svg class="w-8 h-8 text-brand-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 10h.01M12 10h.01M15 10h.01"/>
              </svg>
            </div>
            <h2 class="text-xl font-black text-neutral-900">Our Mission</h2>
          </div>
          <!-- Red underline accent -->
          <div class="w-10 h-[3px] bg-brand-primary rounded mb-6"></div>

          <!-- Mission statements list -->
          <ul class="flex flex-col gap-4 flex-1">
            <li *ngFor="let statement of missionStatements" class="flex items-start gap-3">
              <svg class="w-5 h-5 text-brand-primary shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
              </svg>
              <p class="text-neutral-600 text-sm leading-relaxed">{{ statement }}</p>
            </li>
          </ul>

        </div>


        <!-- VISION CARD -->
        <div class="bg-white rounded-2xl p-8 shadow-sm border border-neutral-100 flex flex-col relative overflow-hidden group hover:shadow-xl transition-shadow duration-500">
          <!-- Icon -->
          <div class="flex items-center gap-4 mb-5">
            <div class="w-14 h-14 rounded-xl bg-red-50 flex items-center justify-center shrink-0 group-hover:bg-brand-primary/10 transition-colors duration-300">
              <svg class="w-8 h-8 text-brand-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </div>
            <h2 class="text-xl font-black text-neutral-900">Our Vision</h2>
          </div>
          <!-- Red underline accent -->
          <div class="w-10 h-[3px] bg-brand-primary rounded mb-6"></div>

          <!-- Vision text -->
          <p class="text-neutral-600 text-sm leading-relaxed flex-1">{{ visionText }}</p>

        </div>


        <!-- GOALS CARD -->
        <div class="md:col-span-2 bg-white rounded-2xl p-8 shadow-sm border border-neutral-100 flex flex-col relative overflow-hidden group hover:shadow-xl transition-shadow duration-500">
          <!-- Icon -->
          <div class="flex items-center gap-4 mb-5">
            <div class="w-14 h-14 rounded-xl bg-red-50 flex items-center justify-center shrink-0 group-hover:bg-brand-primary/10 transition-colors duration-300">
              <svg class="w-8 h-8 text-brand-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="12" cy="12" r="1" fill="currentColor"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 3v2M12 19v2M3 12h2M19 12h2"/>
              </svg>
            </div>
            <h2 class="text-xl font-black text-neutral-900">Our Goals</h2>
          </div>
          <!-- Red underline accent -->
          <div class="w-10 h-[3px] bg-brand-primary rounded mb-6"></div>

          <!-- Goals list -->
          <ul class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4 flex-1">
            <li *ngFor="let goal of goals" class="flex items-start gap-3">
              <svg class="w-5 h-5 text-brand-primary shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
              </svg>
              <p class="text-neutral-600 text-sm leading-relaxed">{{ goal.desc }}</p>
            </li>
          </ul>

        </div>

      </div>
    </div>
  </section>


  <!-- ═══════════════════════════════════════ -->
  <!-- STATS STRIP                             -->
  <!-- ═══════════════════════════════════════ -->
  <section class="bg-brand-primary py-12">
    <div class="max-w-7xl mx-auto px-6 sm:px-10 lg:px-16">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-8 text-center">

        <div class="flex flex-col items-center gap-3">
          <svg class="w-10 h-10 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
          </svg>
          <div>
            <p class="text-3xl md:text-4xl font-black text-white">25+</p>
            <p class="text-white/70 text-xs font-semibold uppercase tracking-widest mt-1">Years of Excellence</p>
          </div>
        </div>

        <div class="flex flex-col items-center gap-3">
          <svg class="w-10 h-10 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          <div>
            <p class="text-3xl md:text-4xl font-black text-white">15,000+</p>
            <p class="text-white/70 text-xs font-semibold uppercase tracking-widest mt-1">Students Empowered</p>
          </div>
        </div>

        <div class="flex flex-col items-center gap-3">
          <svg class="w-10 h-10 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
          </svg>
          <div>
            <p class="text-3xl md:text-4xl font-black text-white">8+</p>
            <p class="text-white/70 text-xs font-semibold uppercase tracking-widest mt-1">Institutions</p>
          </div>
        </div>

        <div class="flex flex-col items-center gap-3">
          <svg class="w-10 h-10 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
          </svg>
          <div>
            <p class="text-3xl md:text-4xl font-black text-white">100+</p>
            <p class="text-white/70 text-xs font-semibold uppercase tracking-widest mt-1">Awards &amp; Accolades</p>
          </div>
        </div>

      </div>
    </div>
  </section>

</main>
