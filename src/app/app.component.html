<app-header></app-header>
<div class="flex flex-col min-h-screen">
  <div class="flex-grow">
    <router-outlet></router-outlet>
  </div>
  <app-footer></app-footer>
</div>

<app-admission-modal></app-admission-modal>

<!-- MOBILE STICKY ADMISSION BAR -->
<div class="lg:hidden fixed bottom-0 inset-x-0 z-[90] px-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] pt-3 bg-white/95 backdrop-blur-xl border-t border-neutral-200 shadow-[0_-8px_30px_rgba(0,0,0,0.08)] flex gap-3">
    <a [href]="admissionsPhoneTel" class="flex-1 py-3.5 rounded-full border-2 border-brand-primary text-brand-primary font-black uppercase tracking-widest text-[0.7rem] flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
        Call
    </a>
    <button type="button" (click)="openAdmissionForm()" class="flex-[2] py-3.5 rounded-full bg-brand-primary text-white font-black uppercase tracking-widest text-[0.7rem] shadow-lg shadow-red-900/20">
        Apply Now · {{ admissionYearLabel }}
    </button>
</div>

<!-- 2026 PREMIUM FLOATING SYSTEM -->
<div class="fixed bottom-24 lg:bottom-8 right-4 lg:right-8 z-[100] flex flex-col items-end gap-6 sm:right-12">
    
    <!-- WHATSAPP CALL TO ACTION -->
    <div class="flex items-center group">
        <!-- Text Label (Now static for cleaner look) -->
        <div class="hidden sm:block mr-3 bg-[#f8f9fa]/95 backdrop-blur-xl px-6 py-3 rounded-full shadow-[0_10px_30px_rgba(0,0,0,0.05)] border border-white/80 pointer-events-auto">
            <p class="text-[0.75rem] font-medium text-[#4b4e52] whitespace-nowrap">
                Need Help? <span class="font-bold text-[#1d1d1f]">Chat with us</span>
            </p>
        </div>
        
        <!-- Main WhatsApp Circular Button -->
        <a [href]="whatsAppUrl" target="_blank" rel="noopener" 
           class="relative w-16 h-16 bg-[#25D366] rounded-full flex items-center justify-center shadow-[0_15px_35px_rgba(37,211,102,0.4)] hover:scale-110 active:scale-95 transition-all duration-500 pointer-events-auto group-hover:shadow-[0_20px_45px_rgba(37,211,102,0.5)]">
            
            <!-- Icon Core -->
            <svg class="w-9 h-9 text-white animate-whatsapp-pulse" fill="currentColor" viewBox="0 0 24 24">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884a9.81 9.81 0 017.008 2.895 9.807 9.807 0 012.887 7.017c-.001 5.451-4.437 9.885-9.896 9.885m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
            </svg>
            
            <!-- Depth Layer -->
            <span class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity rounded-full"></span>
        </a>
    </div>

    <!-- SCROLL TO TOP BUTTON (DYNAMIC ACCESSIBILITY - ONLY SHOWN ON SCROLL STOP) -->
    <button *ngIf="isScrollStopped()" 
            (click)="scrollToTop()" 
            class="w-12 h-12 bg-brand-primary text-white rounded-xl shadow-[0_10px_25px_rgba(139,0,0,0.3)] hover:bg-brand-primary/90 hover:shadow-[0_15px_30px_rgba(139,0,0,0.4)] hover:scale-110 transition-all duration-300 pointer-events-auto flex items-center justify-center animate-whatsapp-pulse">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"/>
        </svg>
    </button>

</div>
